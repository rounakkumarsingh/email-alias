<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alias Maker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="preview" id="preview" aria-live="polite"><span class="p-tag"></span><span class="p-dot">.</span><span class="p-rand"></span><wbr><span class="p-domain"></span></p>

    <div class="row">
      <label class="field grow">
        <span>Tag</span>
        <input id="tag" autocomplete="off" spellcheck="false" maxlength="24" placeholder="github">
      </label>
      <div class="field">
        <span>Random part</span>
        <div class="rand-box">
          <code id="rand"></code>
          <button id="regen" class="icon" type="button" title="New random part" aria-label="New random part">&#8635;</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="fill" class="primary" type="button">Fill on page</button>
      <button id="copy" type="button">Copy</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <details class="block">
      <summary>Block a leaked alias</summary>
      <div class="row tight">
        <input id="block-input" spellcheck="false" placeholder="github.x7k2qf@rounakkumarsingh.com" aria-label="Leaked alias">
        <button id="block-copy" type="button">Copy rule</button>
      </div>
      <p class="hint">Paste the rule at the top of your mail filters.</p>
    </details>

    <section class="recent">
      <h2>Recent</h2>
      <ul id="recent"></ul>
    </section>

    <footer><a href="#" id="open-options">Settings</a></footer>
  </main>
  <script src="alias.js"></script>
  <script src="popup.js"></script>
</body>
</html>
