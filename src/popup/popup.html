<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alias Maker</title>
  <link rel="stylesheet" href="../ui.css">
</head>
<body class="popup">
  <main>
    <p class="preview" id="preview" aria-live="polite"><span class="p-tag"></span><span class="p-dot">.</span><span class="p-rand"></span><wbr><span class="p-domain"></span></p>

    <div class="row">
      <label class="field grow">
        <span>Tag</span>
        <input id="tag" autocomplete="off" spellcheck="false" maxlength="24" placeholder="github">
      </label>
      <div class="field">
        <span>Random part</span>
        <div class="rand-box">
          <code id="rand"></code>
          <button id="regen" class="icon" type="button" title="New random part" aria-label="New random part">&#8635;</button>
        </div>
      </div>
    </div>

    <div class="chips" id="chips" aria-label="Quick tags"></div>

    <div class="actions">
      <button id="fill" class="primary" type="button">Fill on page</button>
      <button id="copy" type="button">Copy</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <div id="label-notice" class="notice" role="status" hidden>
      <p>Create the label <code id="notice-tag"></code> in Proton before mail arrives.</p>
      <div class="row tight">
        <button id="notice-copy" class="small" type="button">Copy label name</button>
        <button id="notice-done" class="small primary" type="button">Done</button>
      </div>
    </div>

    <section class="registry">
      <div class="registry-head">
        <h2>Aliases</h2>
        <a href="#" id="stale" class="badge" hidden>Filter script out of date</a>
      </div>
      <input id="search" type="search" placeholder="Search aliases" aria-label="Search aliases" spellcheck="false">
      <ul id="list"></ul>
    </section>

    <footer><a href="#" id="open-options">Registry &amp; settings</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
